name: Patch mobile release version assertion

on:
  push:
    branches:
      - fix/mobile-key-card-layout

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/mobile-key-card-layout
          fetch-depth: 0

      - name: Update the single integration assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/integration.test.ts")
          text = path.read_text()
          old = 'expect(body.proxy_version).toBe("1.5.0");'
          new = 'expect(body.proxy_version).toBe("1.5.1");'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one version assertion, found {count}")
          path.write_text(text.replace(old, new))
          PY

      - name: Remove one-time workflow and push
        run: |
          rm .github/workflows/patch-mobile-version.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/integration.test.ts .github/workflows/patch-mobile-version.yml
          git commit -m "Update integration version expectation"
          git push origin HEAD:fix/mobile-key-card-layout
