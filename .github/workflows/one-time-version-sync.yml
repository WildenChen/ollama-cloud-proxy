name: One-time version test sync

on:
  push:
    branches:
      - agent/release-1.5.0-doc-sync

permissions:
  contents: write

concurrency:
  group: one-time-version-test-sync
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/release-1.5.0-doc-sync
          fetch-depth: 0

      - name: Replace exactly one version assertion and remove this workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          test_file = Path("tests/integration.test.ts")
          old = 'expect(body.proxy_version).toBe("1.4.0");'
          new = 'expect(body.proxy_version).toBe("1.5.0");'
          text = test_file.read_text()
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one old assertion, found {count}")
          test_file.write_text(text.replace(old, new, 1))

          workflow = Path(".github/workflows/one-time-version-sync.yml")
          workflow.unlink()
          PY

      - name: Commit exact patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/integration.test.ts .github/workflows/one-time-version-sync.yml
          git commit -m "Sync integration version expectation to 1.5.0"
          git push origin HEAD:agent/release-1.5.0-doc-sync
