name: Run proxy key upgrade patch

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/proxy-key-upgrade-ux' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/proxy-key-upgrade-ux
          fetch-depth: 0
      - name: Execute the audited exact patch
        run: |
          python3 <<'BOOT'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-proxy-key-upgrade.yml').read_text()
          marker = "python3 <<'PY'\n"
          if marker not in workflow or "\n          PY\n" not in workflow:
              raise SystemExit('embedded patch script was not found')
          script = workflow.split(marker, 1)[1].split("\n          PY\n", 1)[0]
          exec(compile(textwrap.dedent(script), 'apply-proxy-key-upgrade.py', 'exec'), {'__name__': '__main__'})
          Path('.github/workflows/run-proxy-key-upgrade-on-pr.yml').unlink()
          BOOT
      - name: Commit the completed patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete proxy access key upgrade UX"
          git push origin HEAD:agent/proxy-key-upgrade-ux
