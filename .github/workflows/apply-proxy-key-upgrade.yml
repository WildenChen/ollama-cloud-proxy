              '    if (path === "/admin/client-keys" && req.method === "GET") return json({ clientKeys: this.publicClientApiKeys() });\n    if (path === "/admin/client-keys" && req.method === "POST") return this.createClientApiKey(req);\n    if (path === "/admin/client-key-summary" && req.method === "GET") return json(this.clientKeySummary());\n    if (path === "/admin/client-key-test" && req.method === "POST") return this.testClientApiKey(req);\n\n    const clientKeyMatch',
          )
          replace_once(
              "src/admin/adminRoutes.ts",
              '      return json({ clientKey: safe }, 201);',
              '      return json({ clientKey: safe, token }, 201);',
          )
          replace_once(
              "src/admin/adminRoutes.ts",
