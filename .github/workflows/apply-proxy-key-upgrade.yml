    try {
      const key = this.store.getClientApiKeyOrThrow(id);
      return json({ token: this.cipher.decrypt(key.encryptedToken) });
    } catch (error) {
      return openAiError(404, "client_key_not_found", (error as Error).message);
    }
  }
''',
