      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check environment initializer
        run: sh -n scripts/init-env.sh

      - name: Run tests
        run: bun test

      - name: Validate Docker build
        run: docker build --platform linux/amd64 -t ollama-cloud-proxy:quality .

      - name: Commit synchronized assertion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/integration.test.ts .github/workflows/quality.yml
          git diff --cached --check
          git commit -m "Use runtime version in integration assertion"
          git push origin HEAD:feat/openai-responses-api
