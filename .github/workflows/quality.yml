name: Quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synchronize-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/openai-responses-api
          fetch-depth: 0

      - name: Replace hard-coded version assertion
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("tests/integration.test.ts")
          text = path.read_text()

          old_import = 'import type { AppConfig } from "../src/config/env";'
          new_import = old_import + '\nimport { APP_VERSION } from "../src/config/version";'
          if text.count(old_import) != 1:
              raise SystemExit("AppConfig import mismatch")
          text = text.replace(old_import, new_import, 1)

          old_assertion = 'expect(body.proxy_version).toBe("1.6.4");'
          new_assertion = 'expect(body.proxy_version).toBe(APP_VERSION);'
          if text.count(old_assertion) != 1:
              raise SystemExit("proxy version assertion mismatch")
          text = text.replace(old_assertion, new_assertion, 1)
          path.write_text(text)

          official = "name: Quality\n\non:\n  pull_request:\n  push:\n    branches:\n      - main\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\nconcurrency:\n  group: quality-${{ github.workflow }}-${{ github.ref }}\n  cancel-in-progress: true\n\njobs:\n  test-and-build:\n    runs-on: ubuntu-latest\n\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n\n      - name: Set up Bun\n        uses: oven-sh/setup-bun@v2\n        with:\n          bun-version: 1.2.19\n\n      - name: Install dependencies\n        run: bun install --frozen-lockfile\n\n      - name: Check environment initializer\n        run: sh -n scripts/init-env.sh\n\n      - name: Run tests\n        run: bun test\n\n      - name: Validate Docker build\n        run: docker build --platform linux/amd64 -t ollama-cloud-proxy:quality .\n"
          Path(".github/workflows/quality.yml").write_text(official)
          PY

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check environment initializer
        run: sh -n scripts/init-env.sh

      - name: Run tests
        run: bun test

      - name: Validate Docker build
        run: docker build --platform linux/amd64 -t ollama-cloud-proxy:quality .

      - name: Commit synchronized assertion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/integration.test.ts .github/workflows/quality.yml
          git diff --cached --check
          git commit -m "Use runtime version in integration assertion"
          git push origin HEAD:feat/openai-responses-api
