name: Quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/openai-responses-api
          fetch-depth: 0

      - name: Apply audited Responses API patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          proxy_path = Path("src/proxy/proxyHandler.ts")
          text = proxy_path.read_text()

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"proxyHandler.ts: expected one match, found {count}: {old[:100]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              '''        (path === "/v1/chat/completions" && req.method === "POST") ||
        (path === "/v1/completions" && req.method === "POST")''',
              '''        (path === "/v1/chat/completions" && req.method === "POST") ||
        (path === "/v1/completions" && req.method === "POST") ||
        (path === "/v1/responses" && req.method === "POST")''',
          )

          replace_once(
              '''      const rawBody = await readBodyWithLimit(req, this.config.maxRequestBodySizeBytes);
      mappedBody = this.models.applyAliasToBody(rawBody);''',
              '''      const rawBody = await readBodyWithLimit(req, this.config.maxRequestBodySizeBytes);
      if (path === "/v1/responses") {
        const unsupportedField = this.unsupportedResponsesStateField(rawBody);
        if (unsupportedField) {
          return openAiError(
            400,
            "unsupported_responses_state",
            `Ollama Cloud Responses API is non-stateful; ${unsupportedField} is not supported`,
            { field: unsupportedField, mode: "non-stateful" }
          );
        }
      }
      mappedBody = this.models.applyAliasToBody(rawBody);''',
          )

          replace_once(
              '''  private modelFromBody(rawBody: string): string | null {
    try {''',
              '''  private unsupportedResponsesStateField(rawBody: string): "previous_response_id" | "conversation" | null {
    const parsed = JSON.parse(rawBody || "{}") as Record<string, unknown>;
    if (parsed.previous_response_id !== undefined && parsed.previous_response_id !== null) {
      return "previous_response_id";
    }
    if (parsed.conversation !== undefined && parsed.conversation !== null) {
      return "conversation";
    }
    return null;
  }

  private modelFromBody(rawBody: string): string | null {
    try {''',
          )

          proxy_path.write_text(text)

          changelog = Path("docs/changelog.md")
          changelog_text = changelog.read_text()
          marker = "# 版本更新紀錄\n\n"
          if changelog_text.count(marker) != 1:
              raise SystemExit("changelog marker mismatch")
          release = '''# 版本更新紀錄

## 1.7.0 - 2026-08-02

- 新增 OpenAI Responses API `POST /v1/responses`，支援非串流、SSE 串流、tools/function calling、reasoning 與模型別名。
- Responses API 沿用既有 Proxy Client Key、Concurrency、Key Pool、重試、Key 狀態與安全化上游 4xx 錯誤處理。
- 非串流 Responses 回應可解析 `input_tokens`、`output_tokens` 與 `total_tokens`，寫入既有用量統計。
- 對 `previous_response_id` 與 `conversation` 提供明確的 non-stateful 400 錯誤，避免送出 Ollama Cloud 不支援的 stateful 請求。
- 新增非串流、串流、工具 payload、模型別名、stateful 欄位、上游 400 與真正 401 的整合測試。
- 重寫 README，新增 API 支援矩陣、Responses／Chat／Web Search 範例與 non-stateful 使用說明。

'''
          changelog.write_text(changelog_text.replace(marker, release, 1))

          for temporary in [
              Path(".github/workflows/patch-responses-api.yml"),
              Path(".github/responses-patch-trigger.txt"),
          ]:
              if temporary.exists():
                  temporary.unlink()

          Path(".github/workflows/quality.yml").write_text('''name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check environment initializer
        run: sh -n scripts/init-env.sh

      - name: Run tests
        run: bun test

      - name: Validate Docker build
        run: docker build --platform linux/amd64 -t ollama-cloud-proxy:quality .
''')
          PY

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests on patched tree
        run: bun test

      - name: Validate Docker build on patched tree
        run: docker build --platform linux/amd64 -t ollama-cloud-proxy:quality .

      - name: Commit audited implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement OpenAI Responses API support"
          git push origin HEAD:feat/openai-responses-api
