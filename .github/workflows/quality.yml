name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-hotfix:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/1.6.1-auth-dialog-hotfix' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/1.6.1-auth-dialog-hotfix
          fetch-depth: 0
      - name: Apply audited patch
        run: python3 scripts/apply-1.6.1-hotfix.py
      - name: Restore formal Quality workflow
        run: git show origin/main:.github/workflows/quality.yml > .github/workflows/quality.yml
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix admin onboarding state and token dialog overflow"
          git push origin HEAD:fix/1.6.1-auth-dialog-hotfix
