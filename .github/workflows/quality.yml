name: Quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quality-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/usage-refresh-stability
          fetch-depth: 0

      - name: Apply reviewed precise patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/agent-usage-refresh-patch.yml').read_text()
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          body = workflow[start:end]
          body = "\n".join(line[10:] if line.startswith("          ") else line for line in body.splitlines())
          exec(compile(body, 'usage-refresh-patch.py', 'exec'))
          PY

      - name: Remove temporary files and restore Quality
        run: |
          rm -f .github/workflows/agent-usage-refresh-patch.yml .github/agent-usage-refresh-trigger
          git checkout origin/main -- .github/workflows/quality.yml

      - name: Commit and push final patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Stabilize key validation and usage refresh"
          git push origin HEAD:fix/usage-refresh-stability
