name: Quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/preserve-upstream-client-errors
          fetch-depth: 0

      - name: Apply reviewed source patch
        run: python3 .github/patch-upstream-error-events.py

      - name: Remove temporary files and restore Quality
        run: |
          rm -f .github/patch-upstream-error-events.py
          rm -f .github/workflows/patch-upstream-error-events.yml
          git fetch origin main
          git checkout origin/main -- .github/workflows/quality.yml

      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Record safe upstream client error summaries"
          git push origin HEAD:fix/preserve-upstream-client-errors
