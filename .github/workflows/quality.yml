name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check environment initializer
        run: sh -n scripts/init-env.sh

      - name: Check error classification
        run: bun test tests/error-ux.test.ts --test-name-pattern "user-facing error classification"

      - name: Check safe diagnostics
        run: bun test tests/error-ux.test.ts --test-name-pattern "safe diagnostics"

      - name: Check error browser integration
        run: bun test tests/error-ux.test.ts --test-name-pattern "error guidance assets"

      - name: Run tests
        run: bun test

      - name: Validate Docker build
        run: docker build --platform linux/amd64 -t ollama-cloud-proxy:quality .
