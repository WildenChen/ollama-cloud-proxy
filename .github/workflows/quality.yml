name: Quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quality-followup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-followup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/usage-refresh-stability
          fetch-depth: 0

      - name: Apply precise follow-up
        run: python3 .github/usage-refresh-followup.py

      - name: Remove temporary script and restore Quality
        run: |
          rm -f .github/usage-refresh-followup.py
          git checkout origin/main -- .github/workflows/quality.yml

      - name: Commit and push follow-up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Align tests with event-driven usage refresh"
          git push origin HEAD:fix/usage-refresh-stability
